
<html>
<head>
<title>Personal Information</title>
<script>
function validate()
{
	var name=document.getElementById("nametext");
	var age=document.getElementById("agetext");
	var pass=document.getElementById("passtext");
	var confirmpass=document.getElementById("conftext");
	if(name.value=="" || name.value==" ")
	{
		alert("Please Enter the name. Its the mandatory field");
		return false;
	}
	if((age.value=="") || (age.value<=18) || (age.value>=100))

	{
                 
       		alert("Please Enter the age. Its the mandatory field");
		return false;
	}
	
	if(pass.value=="" || confirmpass.value=="")
	{
		alert("Please Enter the password fiels. Its the mandatory field");
		return false;
	}
	if(pass.value!=confirmpass.value)
	{
		alert("Password does not match");
		return false;
	}
	else
	{
		alert("Thank you for your details.....");
		name.value="";
		age.value="";
		pass.value="";
		confirmpass.value="";
	}
	
}
function reset()
{
	var name=document.getElementById("nametext");
	var age=document.getElementById("agetext");
	var pass=document.getElementById("passtext");
	var confirmpass=document.getElementById("conftext");
	name.value="";
	age.value="";
	pass.value="";
	confirmpass.value="";
}
</script>
</head>
<body>
<table width="458" border="0" align="center">

<img src="images/1.jpg" width="458" height="100"  align="center"></img>

  </tr>
 <tr>

    <td><input type="text" name="password" value="" id="agetext" /> </td>
  </tr>

  <tr>
    <td>Password :</td>
    <td><input type="password" name="password" value="" id="passtext" /> </td>
  </tr>
  <tr>
    <td>Confirm Password :</td>
    <td><input type="password" name="password" value="" id="conftext"/> </td>
  </tr>
   <tr>

   <td><input type="button" name="submit" value="submit" onclick="validate()"></td>
